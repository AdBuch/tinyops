# Nur im Cluster erreichbar. Zugriff per `deploy/k8s.py forward` (kubectl port-forward), kein Ingress.
apiVersion: v1
kind: Service
metadata:
  name: tinyops
  labels: {app: tinyops}
spec:
  type: ClusterIP
  selector:
    app: tinyops
  ports:
    - name: http
      port: 8765
      targetPort: http
