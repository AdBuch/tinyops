<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbeitspanel</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #eceef1; --surface: #ffffff; --raised: #f4f5f8; --ink: #161a21; --quiet: #596271; --line: #d8dce3;
    --focus: #2747d6; --focus-bg: #e3e8fb;
    --ok: #12744a; --ok-bg: #dcf1e6; --bad: #bc2d26; --bad-bg: #fbe3e1; --warn: #94560a; --warn-bg: #faebcf;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0f1217; --surface: #171b22; --raised: #1e232c; --ink: #e8ebf1; --quiet: #9aa3b2; --line: #29303b;
      --focus: #86a2ff; --focus-bg: #1c2540;
      --ok: #62d4a0; --ok-bg: #16302a; --bad: #ff8f87; --bad-bg: #36201f; --warn: #f2bc5c; --warn-bg: #33290f;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 14.5px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
  a { color: var(--focus); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }
  .quiet { color: var(--quiet); }
  .small { font-size: 12.5px; }

  /* Kopfzeile */
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--ground) 92%, transparent); backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--line); height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 22px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .tabs { display: flex; gap: 18px; height: 100%; }
  .tab { all: unset; cursor: pointer; display: flex; align-items: center; height: 100%; font-weight: 600; color: var(--quiet); border-bottom: 2px solid transparent; padding-top: 2px; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--focus); }
  .spacer { flex: 1; }
  .conn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--quiet); }
  .conn:hover { text-decoration: none; color: var(--ink); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--quiet); flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--quiet); }
  button, select { font: inherit; font-size: 13px; }
  .btn, button { cursor: pointer; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .btn:hover, button:hover { border-color: var(--focus); text-decoration: none; }
  button.primary { background: var(--focus); border-color: var(--focus); color: var(--ground); font-weight: 650; }
  button:disabled { opacity: .5; cursor: default; }
  button.quiet-btn { border-color: transparent; background: transparent; color: var(--quiet); }
  #fetched { font-size: 12.5px; color: var(--quiet); }

  /* Übersicht */
  #viewOverview { max-width: 1180px; margin: 0 auto; padding: 22px 20px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 28px; }
  #viewOverview.withaside { grid-template-columns: minmax(0, 1fr) 300px; }
  @media (max-width: 960px) { #viewOverview.withaside { grid-template-columns: minmax(0, 1fr); } }
  .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .secthead { display: flex; align-items: baseline; gap: 12px; margin: 0 0 10px; }
  .secthead h2 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -.005em; }
  .secthead .count { color: var(--quiet); font-weight: 600; }
  .secthead .right { margin-left: auto; font-size: 13px; color: var(--quiet); display: flex; gap: 14px; }

  /* Fokus: die Story-Plätze */
  .slots { display: grid; grid-template-columns: repeat(var(--slots, 2), minmax(0, 1fr)); gap: 14px; margin-bottom: 30px; }
  @media (max-width: 760px) { .slots { grid-template-columns: minmax(0, 1fr); } }
  .slot { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-height: 132px; display: flex; flex-direction: column; gap: 10px; }
  .slot.free { background: transparent; border: 1.5px dashed var(--line); color: var(--quiet); justify-content: center; align-items: flex-start; }
  .slot.free strong { font-size: 15px; color: var(--ink); font-weight: 650; }
  .slot.over { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
  .slot .top { display: flex; gap: 10px; align-items: center; }
  .slot .key { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .slot .sum { font-size: 17px; font-weight: 680; line-height: 1.28; letter-spacing: -.01em; color: var(--ink); }
  .slot .sum:hover { text-decoration: none; color: var(--focus); }
  .slot .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; align-items: center; }
  .mrchip { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--ink); background: var(--raised); }
  .mrchip:hover { border-color: var(--focus); text-decoration: none; }
  .nolink { color: var(--warn); font-size: 13px; font-weight: 600; }
  .overnote { margin: -18px 0 26px; color: var(--bad); font-weight: 600; }

  /* Filterleiste */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
  .toolbar input[type=search] { flex: 1 1 260px; max-width: 420px; font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .toolbar select { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .tog { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; user-select: none; }
  .tog:has(input:checked) { background: var(--focus-bg); border-color: var(--focus); color: var(--focus); font-weight: 600; }
  .tog input { position: absolute; opacity: 0; pointer-events: none; }
  .tog:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  #fcount { margin-left: auto; font-size: 13px; color: var(--quiet); }

  /* Listen */
  .group { margin-bottom: 26px; }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .item { display: grid; grid-template-columns: 5px minmax(0, 1fr) auto; column-gap: 14px; padding: 11px 16px 11px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: var(--raised); }
  .rail { background: transparent; }
  .rail.bad { background: var(--bad); } .rail.focus { background: var(--focus); } .rail.warn { background: var(--warn); } .rail.ok { background: var(--ok); }
  .l1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .l1 .t { font-weight: 650; color: var(--ink); font-size: 14.5px; }
  .l1 .t:hover { color: var(--focus); text-decoration: none; }
  .l2 { display: flex; gap: 6px 16px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--quiet); margin-top: 2px; }
  .l2 code { color: var(--ink); background: var(--raised); padding: 0 6px; border-radius: 5px; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }
  .reason { font-weight: 650; }
  .reason.bad { color: var(--bad); } .reason.focus { color: var(--focus); } .reason.warn { color: var(--warn); }
  .age.stale { color: var(--warn); font-weight: 650; }
  .acts { display: flex; gap: 8px; align-items: center; align-self: center; flex-wrap: wrap; justify-content: flex-end; }
  .acts a, .acts button { font-size: 13px; }
  .l3 { grid-column: 2 / 4; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .pd { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--quiet); flex: none; }
  .pd.success { background: var(--ok); } .pd.failed { background: var(--bad); }
  .pd.running, .pd.pending { background: var(--focus); animation: pulse 1.6s ease-in-out infinite; }
  .pd.none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--quiet); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .pd.running, .pd.pending { animation: none; } }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--raised); color: var(--quiet); border: 1px solid transparent; white-space: nowrap; }
  a.chip:hover { text-decoration: none; border-color: var(--focus); }
  .chip.tk { background: var(--focus-bg); color: var(--focus); }
  .chip.out { background: transparent; border: 1px dashed var(--quiet); color: var(--quiet); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.agent { background: transparent; border-color: var(--focus); color: var(--focus); }
  .chip.draft { background: var(--warn-bg); color: var(--warn); }
  .empty { color: var(--quiet); padding: 16px 18px; }
  .nomatch { color: var(--quiet); padding: 28px 8px; text-align: center; }

  /* Seitenspalte (Ideenbox, Jobs: vorerst aus) */
  aside h2 { font-size: 15px; margin: 0 0 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .idea { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .idea.expired { opacity: .5; }
  .idea:last-child { border-bottom: 0; }
  .meta { color: var(--quiet); font-size: 13px; }
  .badge { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--raised); color: var(--quiet); }
  .badge.success { background: var(--ok-bg); color: var(--ok); } .badge.failed { background: var(--bad-bg); color: var(--bad); } .badge.running { background: var(--focus-bg); color: var(--focus); }
  textarea { font: inherit; width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); }
  pre.log { background: #0d1015; color: #d8dde6; padding: 10px; border-radius: 8px; max-height: 240px; overflow: auto; font: 12px/1.5 var(--mono); white-space: pre-wrap; margin: 6px 0 0; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); width: min(720px, 92vw); }
  dialog::backdrop { background: rgba(8, 10, 14, .5); }
  dialog textarea { height: 300px; font-family: var(--mono); font-size: 13px; }
  .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 9px 16px; border-radius: 10px; z-index: 20; max-width: 90vw; }

  /* Einstellungen */
  #viewSettings { max-width: 1060px; margin: 0 auto; padding: 22px 20px 110px; }
  .setgrid { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 36px; }
  @media (max-width: 800px) { .setgrid { grid-template-columns: minmax(0, 1fr); } .setnav { display: none; } }
  .setnav { position: sticky; top: 76px; align-self: start; display: grid; gap: 2px; }
  .setnav button { all: unset; cursor: pointer; padding: 6px 10px; border-radius: 8px; color: var(--quiet); font-weight: 600; }
  .setnav button:hover { background: var(--surface); color: var(--ink); }
  .setnav button.on { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 0 var(--focus); }
  .sset { padding-bottom: 30px; margin-bottom: 30px; border-bottom: 1px solid var(--line); scroll-margin-top: 70px; }
  .sset:last-child { border-bottom: 0; }
  .sset > header { all: unset; display: block; margin-bottom: 14px; }
  .sset h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.015em; }
  .sset h3 { font-size: 14px; margin: 22px 0 6px; }
  .lead { color: var(--quiet); margin: 0; max-width: 62ch; }
  .field { display: grid; gap: 4px; margin-bottom: 12px; }
  .field > label { font-size: 13px; font-weight: 650; }
  .field .help { font-size: 12.5px; color: var(--quiet); max-width: 70ch; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  input[type=text], input[type=password], input[type=number], select.full, textarea.full {
    width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  textarea.full { font-family: var(--mono); font-size: 13px; resize: vertical; }
  .ferr { color: var(--bad); font-size: 12.5px; }
  .ferr:empty { display: none; }
  .steps { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .step { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .step .ic { font-weight: 800; text-align: center; }
  .step.ok .ic { color: var(--ok); } .step.fail .ic { color: var(--bad); } .step.warn .ic { color: var(--warn); } .step.skip { opacity: .6; }
  .step .st { font-weight: 650; }
  .step .sd { font-size: 13px; color: var(--quiet); white-space: pre-wrap; word-break: break-word; }
  .step.fail { background: var(--bad-bg); }
  .hint { margin-top: 5px; font-size: 13px; padding: 7px 10px; border-radius: 8px; background: var(--focus-bg); color: var(--ink); }
  .step.fail .hint { background: var(--surface); }
  .verdict { padding: 9px 12px; font-weight: 700; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); } .verdict.bad { background: var(--bad-bg); color: var(--bad); }
  .pchip { display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); font-size: 13px; margin: 0 6px 6px 0; }
  .pchip button { border: 0; background: transparent; padding: 0 2px; font-size: 15px; line-height: 1; }
  .pchip input { width: 150px; padding: 2px 6px; font-size: 13px; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--ground) 94%, transparent); backdrop-filter: blur(8px);
             border-top: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 14px; justify-content: center; align-items: center; z-index: 6; }
  table.mini { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.mini td, table.mini th { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  label.check { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  label.check input { margin-top: 3px; }
  @media (max-width: 720px) {
    header { height: auto; flex-wrap: wrap; gap: 6px 14px; padding: 8px 16px; }
    header h1, #fetched, #logBtn { display: none; }
    .tabs { height: 36px; }
    #viewOverview, #viewSettings { padding-left: 16px; padding-right: 16px; }
    .item { grid-template-columns: 5px minmax(0, 1fr); }
    .item .acts { grid-column: 2; justify-content: flex-start; margin-top: 8px; }
    .l3 { grid-column: 2; }
    .l2 code { max-width: 200px; }
    .savebar { padding: 8px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Arbeitspanel</h1>
  <nav class="tabs"><button class="tab on" data-view="overview">Übersicht</button><button class="tab" data-view="settings">Einstellungen</button></nav>
  <span class="spacer"></span>
  <a id="pGl" class="conn" href="#settings" style="display:none"></a>
  <a id="pJi" class="conn" href="#settings" style="display:none"></a>
  <span id="demo" class="chip warn" style="display:none">Demo-Daten</span>
  <span id="fetched"></span>
  <button id="logBtn" class="quiet-btn">Log</button>
  <button id="refresh">Neu laden</button>
</header>

<div id="viewOverview">
  <section id="left">
    <div id="banners"></div>
    <div id="focusBox"></div>
    <div class="toolbar" id="toolbar" hidden>
      <input type="search" id="fq" placeholder="Suchen: Titel, Branch, Ticket   ( / )" aria-label="Suchen" autocomplete="off">
      <select id="fproj" aria-label="Projekt"></select>
      <label class="tog"><input type="checkbox" id="fagent"> Nur Agent</label>
      <label class="tog"><input type="checkbox" id="fnotk"> Ohne Ticket</label>
      <label class="tog"><input type="checkbox" id="fstale"> Liegt schon lange</label>
      <span id="fcount"></span>
    </div>
    <div id="list"></div>
  </section>
  <aside id="aside" hidden>
   <div id="ideasBox" hidden>
    <h2>Ideenbox <span id="ideaCount" class="quiet"></span></h2>
    <div class="card">
      <textarea id="ideaText" rows="2" placeholder="Idee kurz festhalten, Enter speichert (Shift+Enter = neue Zeile)"></textarea>
      <div class="row" style="margin-top:6px">
        <button id="triage">Triage-Prompt kopieren</button>
        <span class="quiet small">Nur erfassen. Gestartet wird nichts.</span>
      </div>
      <div id="ideas"></div>
    </div>
   </div>
   <div id="jobsBox" hidden>
    <h2>Test-Jobs</h2>
    <div id="jobs"></div>
   </div>
  </aside>
</div>
<div id="viewSettings" hidden></div>

<dialog id="dlg">
  <div class="row" style="justify-content:space-between"><strong id="dlgTitle">Prompt</strong><button id="dlgClose">Schließen</button></div>
  <textarea id="dlgText" readonly></textarea>
  <div class="row" style="margin-top:8px"><button class="primary" id="dlgCopy">Kopieren</button></div>
</dialog>

<dialog id="logDlg" style="width:min(1000px,96vw)">
  <div class="row" style="justify-content:space-between">
    <strong>Log <span id="logFile" class="quiet small" style="font-weight:400"></span></strong>
    <span class="row">
      <select id="logLevel"><option value="debug">alles</option><option value="info" selected>ab Info</option><option value="warning">nur Warnungen und Fehler</option></select>
      <button id="logReload">Neu laden</button><button id="logClose">Schließen</button>
    </span>
  </div>
  <pre class="log" id="logText" style="max-height:60vh"></pre>
  <div class="quiet small" style="margin-top:6px">Jede Anfrage und jede Branch-Entscheidung steht nur im Log, wenn der Server mit <code>-v</code> oder <code>log_level: debug</code> läuft.</div>
</dialog>

<script>
const H = { 'X-Requested-With': 'tinyops', 'Content-Type': 'application/json' };
let state = null;
const openLogs = new Set();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: H, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || ('HTTP ' + r.status)); e.data = data; throw e; }
  return data;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

async function copyText(text, title) {
  try { await navigator.clipboard.writeText(text); toast('Kopiert'); return; } catch (e) { /* Fallback unten */ }
  document.getElementById('dlgTitle').textContent = title || 'Prompt';
  document.getElementById('dlgText').value = text;
  document.getElementById('dlg').showModal();
}
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- Übersicht
const pipelineLabel = { success: 'Pipeline grün', failed: 'Pipeline rot', running: 'Pipeline läuft', pending: 'Pipeline wartet', none: 'keine Pipeline' };
const F = () => (state && state.features) || {};
const LS = {
  get(k, d) { try { const v = localStorage.getItem('tinyops.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tinyops.' + k, JSON.stringify(v)); } catch (e) { /* egal */ } },
};
const filt = { q: '', proj: LS.get('proj', ''), agent: LS.get('agent', false), notk: LS.get('notk', false), stale: LS.get('stale', false) };

// Warum steht das hier? Eine Zeile, die sagt, was von dir erwartet wird.
function reasonOf(it) {
  if (it.kind === 'review') return { t: 'Review wartet auf dich', c: 'focus' };
  if (it.kind === 'assigned') return { t: 'Dir zugeteilt', c: 'focus' };
  if (it.kind === 'branch') return { t: it.ahead ? `${it.ahead} Commit${it.ahead === 1 ? '' : 's'} ohne MR` : 'Branch ohne MR', c: '' };
  if (it.draft) return { t: 'Draft', c: '' };
  if (it.pipeline === 'failed') return { t: 'Pipeline rot', c: 'bad' };
  if (it.pipeline === 'success') return { t: 'Bereit zum Mergen', c: 'focus' };
  if (['running', 'pending', 'created', 'waiting_for_resource'].includes(it.pipeline)) return { t: 'Pipeline läuft', c: '' };
  return { t: 'Offen', c: '' };
}
function railOf(it) {
  const r = reasonOf(it);
  if (r.c === 'bad') return 'bad';
  if (it.stale) return 'warn';
  return r.c === 'focus' ? 'focus' : '';
}
function ticketChip(it) {
  const j = state.jira;
  if (!j || !j.ok) return '';
  if (it.ticket) {
    const t = it.ticket;
    const out = j.only_active && t.in_sprint === false;
    const cls = out ? 'chip out' : 'chip tk';
    const hint = esc(t.summary) + (t.sprint ? ' · ' + esc(t.sprint) : out ? ' · nicht in einem aktiven Sprint' : '');
    return `<a class="${cls}" href="${esc(t.url)}" target="_blank" rel="noopener" title="${hint}">${esc(t.key)} · ${esc(t.status)}${out ? ' · außerhalb Sprint' : ''}</a>`;
  }
  if (it.ticket_unknown) return `<span class="chip warn" title="Dieser Key wurde in Jira nicht gefunden">${esc(it.ticket_unknown)}?</span>`;
  if (it.no_ticket) return '<span class="chip warn">ohne Ticket</span>';
  return '';
}
function ageHtml(it) {
  const txt = it.age_days === 0 ? 'heute' : it.age_days === 1 ? 'seit gestern' : `seit ${it.age_days} Tagen`;
  return `<span class="age ${it.stale ? 'stale' : ''}">${txt}</span>`;
}

function row(it) {
  const r = reasonOf(it);
  const mr = it.iid ? `!${it.iid}` : '';
  const chips = [ticketChip(it)];
  if (it.draft && it.kind !== 'branch') chips.push('<span class="chip draft">Draft</span>');
  if (it.by_agent) chips.push('<span class="chip agent" title="Commits vom Agenten (Konto oder Co-Authored-By)">Agent</span>');
  else if (it.kind === 'branch' && it.by_me) chips.push('<span class="chip" title="Mindestens ein Commit von dir">von mir</span>');
  const pipe = it.kind === 'branch' ? '' : `<span class="pd ${esc(it.pipeline)}" title="${esc(pipelineLabel[it.pipeline] || it.pipeline)}"></span>`;
  const acts = [];
  if (it.pipeline_url) acts.push(`<a href="${esc(it.pipeline_url)}" target="_blank" rel="noopener">Pipeline</a>`);
  if (it.no_ticket && it.create_url) acts.push(`<a class="btn" href="${esc(it.create_url)}" target="_blank" rel="noopener">Ticket anlegen</a>`);
  acts.push(`<a class="btn" href="${esc(it.url)}" target="_blank" rel="noopener">Öffnen</a>`);
  const parts = [];
  if (F().testenv && it.iid && it.can_deploy) {
    const opts = state.prompts.map(p => `<option>${esc(p)}</option>`).join('');
    const lock = it.agent_locked ? ' disabled title="Story-Limit überschritten: Agenten nur für Tickets, die schon in Arbeit sind"' : '';
    parts.push(`<button class="primary" data-act="deploy">Testumgebung starten</button><button data-act="teardown">Abbauen</button>
      <select class="ps">${opts}</select><button data-act="copy">Prompt kopieren</button>
      ${state.agent_enabled ? `<button data-act="agent"${lock}>Agent starten</button>` : ''}`);
  }
  if (it.no_ticket && F().ideas) parts.push(`<button data-act="idea" data-text="${esc('Branch ' + it.branch + ': ' + it.title)}">In Ideenbox parken</button>`);
  return `<div class="item">
    <div class="rail ${railOf(it)}"></div>
    <div>
      <div class="l1">${pipe}<a class="t" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>${chips.join('')}</div>
      <div class="l2"><span class="reason ${r.c}">${esc(r.t)}</span><span>${esc(it.project)}${mr ? ' ' + mr : ''}</span><code title="${esc(it.branch)}">${esc(it.branch)}</code>${ageHtml(it)}</div>
    </div>
    <div class="acts">${acts.join('')}</div>
    ${parts.length ? `<div class="l3" data-p="${it.project_id}" data-i="${it.iid ?? ''}">${parts.join('')}</div>` : ''}
  </div>`;
}

function matches(it) {
  if (filt.proj && it.project !== filt.proj) return false;
  if (filt.agent && !it.by_agent) return false;
  if (filt.notk && !it.no_ticket) return false;
  if (filt.stale && !it.stale) return false;
  if (filt.q) {
    const hay = [it.title, it.branch, it.project, it.ticket && it.ticket.key, it.ticket && it.ticket.summary, it.ticket_unknown].join(' ').toLowerCase();
    if (!filt.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function group(title, items, empty, hint) {
  const body = items.length ? `<div class="list">${items.map(row).join('')}</div>` : `<div class="list"><div class="empty">${esc(empty)}</div></div>`;
  return `<div class="group"><div class="secthead"><h2>${esc(title)}</h2><span class="count">${items.length}</span>${hint ? `<span class="right">${hint}</span>` : ''}</div>${body}</div>`;
}

function focusHtml() {
  const j = state.jira;
  if (!j || !j.ok) {
    if (!state.configured) return '';
    return `<div class="secthead"><h2>Fokus</h2><span class="right">Ohne Jira zählt das Panel nur MRs und Branches: ${state.wip} von ${state.wip_limit}.</span></div>`;
  }
  const slots = [];
  const n = Math.max(j.limit, j.stories.length);
  for (let i = 0; i < n; i++) {
    const s = j.stories[i];
    if (!s) {
      slots.push(`<div class="slot free"><strong>Platz frei</strong><span>Du kannst eine neue Story beginnen.</span></div>`);
      continue;
    }
    const over = i >= j.limit;
    const mrs = s.items.map(x => `<a class="mrchip" href="${esc(x.url)}" target="_blank" rel="noopener"><span class="pd ${esc(x.pipeline)}"></span>${x.iid ? '!' + esc(x.iid) : esc(x.branch)}</a>`).join('');
    slots.push(`<div class="slot ${over ? 'over' : ''}">
      <div class="top"><span class="key">${esc(s.key)}</span><span class="chip">${esc(s.status)}</span>${s.sprint ? `<span class="chip tk" title="Aktiver Sprint">${esc(s.sprint)}</span>` : ''}</div>
      <a class="sum" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.summary)}</a>
      <div class="links">${mrs}${s.no_mr ? '<span class="nolink">Noch kein MR oder Branch mit diesem Key</span>' : ''}</div>
    </div>`);
  }
  const sp = (j.sprints || []).map(s => `${esc(s.name)}${s.days_left !== null && s.days_left !== undefined ? (s.days_left >= 0 ? ` · noch ${s.days_left} Tage` : ' · überfällig') : ''}`).join(', ');
  const scope = j.only_active ? 'nur aktive Sprints' : 'alle Sprints';
  return `<div class="secthead"><h2>Stories in Arbeit</h2><span class="count">${j.count} von ${j.limit}</span>
      <span class="right">${sp ? esc(scope) + ': ' + sp : esc(scope)}</span></div>
    <div class="slots" style="--slots:${Math.min(n, 3)}">${slots.join('')}</div>
    ${j.over ? `<div class="overnote">${j.count} Stories in Arbeit, Limit ${j.limit}. Eine abschließen oder zurücksetzen, bevor etwas Neues beginnt.</div>` : ''}`;
}

function renderLeft() {
  let banners = '';
  if (!state.configured) {
    banners += `<div class="banner warn"><strong>Noch nicht verbunden.</strong> ${state.problems.map(esc).join(' ')}
      <div style="margin-top:8px"><button class="primary" onclick="setView('settings')">Einstellungen öffnen</button></div></div>`;
  }
  if (state.errors.length) banners += `<div class="banner bad">${state.errors.map(esc).join('<br>')}</div>`;
  $('banners').innerHTML = banners;
  const tb = $('toolbar');
  if (!state.configured) { $('focusBox').innerHTML = ''; $('list').innerHTML = ''; tb.hidden = true; return; }
  $('focusBox').innerHTML = focusHtml();

  const all = state.review.concat(state.assigned, state.mine);
  const projs = [...new Set(all.map(i => i.project))].sort();
  const sel = $('fproj');
  if (filt.proj && !projs.includes(filt.proj)) filt.proj = '';
  sel.innerHTML = '<option value="">Alle Projekte</option>' + projs.map(p => `<option ${p === filt.proj ? 'selected' : ''}>${esc(p)}</option>`).join('');
  $('fagent').checked = filt.agent; $('fnotk').checked = filt.notk; $('fstale').checked = filt.stale;
  tb.hidden = false;
  $('fnotk').parentElement.hidden = !(state.jira && state.jira.ok);

  const mine = state.mine;
  const needs = state.review.concat(state.assigned, mine.filter(i => i.kind === 'mr' && (i.pipeline === 'failed' || (i.pipeline === 'success' && !i.draft)))).filter(matches);
  const needSet = new Set(needs);
  const mrs = mine.filter(i => i.kind === 'mr' && matches(i) && !needSet.has(i));
  const branches = mine.filter(i => i.kind === 'branch' && matches(i));
  const shown = needs.length + mrs.length + branches.length;
  const total = all.length;
  $('fcount').textContent = shown === total ? `${total} Einträge` : `${shown} von ${total}`;

  const ign = state.ignored_branches;
  $('list').innerHTML = shown === 0 && total > 0
    ? '<div class="nomatch">Kein Eintrag passt zu den Filtern.</div>'
    : group('Braucht dich', needs, 'Nichts wartet auf dich.')
    + group('Meine MRs', mrs, 'Keine weiteren offenen MRs.')
    + group('Offene Branches', branches, 'Keine offenen Branches mit Commits von dir oder deinem Agenten.',
        state.ignore_patterns && state.ignore_patterns.length ? `ignoriert: ${state.ignore_patterns.map(esc).join(', ')}` : '');
}
function renderIdeas() {
  const ideas = state.ideas;
  const open = ideas.filter(i => ['neu', 'geparkt'].includes(i.status) && !i.expired).length;
  document.getElementById('ideaCount').textContent = `${open}/${state.idea_cap}`;
  const list = ideas.filter(i => !['verworfen', 'erledigt'].includes(i.status));
  document.getElementById('ideas').innerHTML = list.length ? list.map(i => `
    <div class="idea ${i.expired ? 'expired' : ''}" data-id="${i.id}">
      <div>${esc(i.text)}</div>
      <div class="meta">${i.expired ? 'verfallen · ' : ''}${esc(i.status)} · ${i.age_days} Tage</div>
      <div class="row" style="margin-top:4px">
        ${i.status === 'neu' && !i.expired ? '<button data-ia="park">Parken</button>' : ''}
        <button data-ia="done">Erledigt</button>
        <button data-ia="drop">Verwerfen</button>
      </div>
    </div>`).join('') : '<div class="empty">Leer. Das ist ein gutes Zeichen.</div>';
}

function renderJobs() {
  const jobs = state.jobs;
  document.getElementById('jobs').innerHTML = jobs.length ? jobs.map(j => `
    <div class="card" data-job="${j.id}">
      <div class="row"><span class="badge ${j.status === 'ok' ? 'success' : j.status === 'fehler' ? 'failed' : 'running'}">${esc(j.status)}</span>
        <span>${esc(j.title)}</span></div>
      <div class="row" style="margin-top:6px"><button data-ja="log">${openLogs.has(j.id) ? 'Log zu' : 'Log'}</button></div>
      <pre class="log" id="log${j.id}" style="display:${openLogs.has(j.id) ? 'block' : 'none'}"></pre>
    </div>`).join('') : '<div class="empty">Noch nichts gestartet.</div>';
  openLogs.forEach(loadLog);
}

async function loadLog(id) {
  try {
    const j = await api('GET', '/api/jobs/' + id);
    const el = document.getElementById('log' + id);
    if (el) { el.textContent = j.log.join('\n'); el.scrollTop = el.scrollHeight; }

function renderHeader() {
  const gl = $('pGl'), ji = $('pJi');
  gl.style.display = ''; ji.style.display = '';
  const dot = (cls, text, title) => `<span class="dot ${cls}"></span>${text}`;
  if (!state.configured) { gl.innerHTML = dot('off', 'GitLab'); gl.title = 'Nicht verbunden'; }
  else if (state.errors.some(e => !e.startsWith('Jira'))) { gl.innerHTML = dot('bad', 'GitLab'); gl.title = 'Fehler, Details im Banner'; }
  else { gl.innerHTML = dot('ok', 'GitLab'); gl.title = 'Verbunden'; }
  if (state.jira && state.jira.ok) { ji.innerHTML = dot('ok', 'Jira'); ji.title = 'Verbunden'; }
  else if (state.jira) { ji.innerHTML = dot('bad', 'Jira'); ji.title = state.jira.error; }
  else { ji.innerHTML = dot('off', 'Jira'); ji.title = 'Nicht eingerichtet'; }
  $('demo').style.display = state.demo ? '' : 'none';
  $('fetched').textContent = 'Stand ' + new Date(state.fetched * 1000).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
}

function renderAside() {
  const f = F();
  $('ideasBox').hidden = !f.ideas;
  $('jobsBox').hidden = !f.testenv;

}

document.getElementById('list').addEventListener('click', async ev => {
  const btn = ev.target.closest('button[data-act]');
  if (!btn) return;
  if (btn.dataset.act === 'idea') {
    try { await api('POST', '/api/ideas', { text: btn.dataset.text }); toast('In der Ideenbox'); await load(); } catch (e) { toast(e.message); }
    return;
  }
  const row = btn.closest('[data-p]');
  const body = { project_id: +row.dataset.p, iid: +row.dataset.i };
  const name = row.querySelector('.ps')?.value;
  try {
    if (btn.dataset.act === 'deploy') { await api('POST', '/api/deploy', body); toast('Deploy gestartet'); }
    if (btn.dataset.act === 'teardown') {
      if (!confirm('Test-Namespace dieses MR abbauen?')) return;
      await api('POST', '/api/teardown', body); toast('Abbau gestartet');
    }
    if (btn.dataset.act === 'copy') { const r = await api('POST', '/api/prompt', { ...body, name }); await copyText(r.prompt, 'Prompt: ' + name); return; }
    if (btn.dataset.act === 'agent') {
      if (!confirm(`Agent mit Prompt "${name}" lokal starten?`)) return;
      await api('POST', '/api/agent', { ...body, name }); toast('Agent gestartet');

    await load();
  } catch (e) { toast(e.message); }
});

function field(id, label, value, opts = {}) {
  const t = opts.type || 'text';
  const input = opts.area
    ? `<textarea class="full" id="${id}" rows="${opts.rows || 3}" spellcheck="false">${esc(value)}</textarea>`
    : `<input type="${t}" id="${id}" value="${esc(value)}" ${opts.ph ? `placeholder="${esc(opts.ph)}"` : ''} autocomplete="off" spellcheck="false">`;
  return `<div class="field"><label for="${id}">${esc(label)}</label>${input}
    ${opts.help ? `<div class="help">${opts.help}</div>` : ''}<div class="ferr" data-err="${esc(opts.err || '')}"></div></div>`;
}

function stepsHtml(res) {
  const ic = { ok: '✓', fail: '✗', warn: '!', skip: '–' };
  return '<div class="steps">' + res.steps.map(s => `
    <div class="step ${esc(s.status)}"><span class="ic">${ic[s.status] || '?'}</span><div>
      <div class="st">${esc(s.title)}</div>
      ${s.detail ? `<div class="sd">${esc(s.detail)}</div>` : ''}
      ${s.hint ? `<div class="hint">💡 ${esc(s.hint)}</div>` : ''}</div></div>`).join('')
    + `<div class="verdict ${res.ok ? 'ok' : 'bad'}">${res.ok ? 'Verbindung in Ordnung.' : 'Nicht in Ordnung: Der erste rote Schritt zeigt, wo es hängt.'}</div></div>`;

  const st = S.secrets[name];

}

    <div id="id-result"></div>
    <div class="grid2">
      ${field('bf-emails', 'Meine E-Mail-Adressen', b.emails.join(', '), { err: 'branch_filter.emails', help: 'Komma getrennt. Alle Adressen, unter denen du committest.' })}
      ${field('bf-names', 'Meine Autorennamen', b.names.join(', '), { err: 'branch_filter.names' })}
      ${field('bf-aemails', 'E-Mail-Adressen des Agenten', b.agent_emails.join(', '), { err: 'branch_filter.agent_emails', help: 'Nur, wenn der Agent unter einem eigenen Konto committet.' })}
      ${field('bf-anames', 'Namen des Agenten', b.agent_names.join(', '), { err: 'branch_filter.agent_names' })}
    </div>
    ${field('bf-pat', 'Muster in Commit-Nachrichten, die den Agenten kennzeichnen', b.agent_message_patterns.join(', '), { err: 'branch_filter.agent_message_patterns',
      help: 'Zum Beispiel <code>Co-Authored-By: Claude</code>. Markiert nur («Agent»); ein Branch erscheint nur wegen Commits von dir oder dem Agenten-Konto.' })}`)}

  ${sect('filters', 'Filter', 'Was auf der Übersicht erscheinen soll und was nicht.', `
    ${field('bf-ignore', 'Branches ignorieren', (b.ignore_branches || []).join(', '), { err: 'branch_filter.ignore_branches', ph: 'release/*, hotfix/*',
      help: 'Muster mit <code>*</code> als Platzhalter, Groß/Klein zählt. <code>release/*</code> blendet alle Branches aus, die mit «release/» beginnen: Branches ohne MR und deine eigenen MRs. Review-Anfragen und dir zugeteilte MRs bleiben sichtbar.' })}
    <div class="grid2">
      ${field('bf-max', 'Höchstens so viele Branches pro Projekt prüfen', b.max_branches, { type: 'number', err: 'branch_filter.max_branches' })}
      ${field('bf-age', 'Branches älter als so viele Tage ignorieren (0 = nie)', b.max_age_days, { type: 'number', err: 'branch_filter.max_age_days' })}
    </div>`)}

  ${sect('jira', 'Jira', 'Optional. Verknüpft MRs und Branches mit Tickets und zählt die Stories in Arbeit. Adresse leer lassen = Jira aus.', `
    <div class="grid2">
      ${field('ji-url', 'Adresse', j.url, { ph: 'https://jira.firma.example', err: 'jira.url', help: 'Basisadresse (mit Kontextpfad, falls Jira unter /jira läuft).' })}
      <div class="field"><label for="ji-auth">Anmeldeart</label>
        <select class="full" id="ji-auth"><option value="bearer" ${j.auth === 'bearer' ? 'selected' : ''}>bearer: Personal Access Token (empfohlen)</option>
          <option value="basic" ${j.auth === 'basic' ? 'selected' : ''}>basic: Benutzername + Passwort</option></select>
        <div class="ferr" data-err="jira.auth"></div></div>
    </div>
    <div id="ji-userbox">${field('ji-user', 'Benutzername', j.username, { err: 'jira.username', help: 'Meist der Jira-Benutzername, nicht die E-Mail-Adresse.' })}</div>
    <div id="ji-secbox"></div>
    <div class="grid2">
      ${field('ji-keys', 'Projekt-Keys', j.project_keys.join(', '), { err: 'jira.project_keys', ph: 'DLP, OPS', help: 'Damit erkennt das Panel Ticket-Nummern in Branch-Namen.' })}
      ${field('ji-limit', 'Höchstens so viele Stories gleichzeitig in Arbeit', j.story_limit, { type: 'number', err: 'jira.story_limit' })}
    </div>
    ${field('ji-types', 'Vorgangstypen, die beim Limit zählen', j.wip_issue_types.join(', '), { err: 'jira.wip_issue_types', help: 'Deutsche Instanzen: oft «Aufgabe», «Fehler». Leer = alle Typen zählen.' })}
    <label class="check"><input type="checkbox" id="ji-sprint" ${j.only_active_sprints !== false ? 'checked' : ''}>
      <span><strong>Nur Tickets aus aktiven Sprints</strong><br><span class="quiet small">Ergänzt die JQL um <code>sprint in openSprints()</code> und markiert verknüpfte Tickets ausserhalb eines Sprints. Braucht Jira Software. Der Test unten sagt, ob es funktioniert.</span></span></label>
    ${field('ji-jql', 'JQL für «in Arbeit»', j.jql_in_progress, { area: true, rows: 2, err: 'jira.jql_in_progress',
      help: 'Zuerst im Jira-Suchfeld (Erweitert) probieren. Der Test unten zeigt die ersten Treffer.' })}
    <div class="row"><button class="primary" id="ji-test">Verbindung testen</button>
      ${(S.secrets.jira_token.set || S.secrets.jira_password.set) ? '<button id="ji-del">Gespeicherte Zugangsdaten löschen</button>' : ''}</div>
    <div id="ji-result"></div>`)}

  ${sect('more', 'Weiteres', 'Vorerst ausgeblendet, damit die Oberfläche beim Wesentlichen bleibt.', `
    <label class="check"><input type="checkbox" id="ft-ideas" ${S.features.ideas ? 'checked' : ''}><span>Ideenbox</span></label>
    <label class="check"><input type="checkbox" id="ft-testenv" ${S.features.testenv ? 'checked' : ''}><span>Testumgebungen, Prompts und Agenten-Knöpfe <span class="quiet small">(braucht Helm-Angaben je Projekt in der config.json)</span></span></label>`)}

  ${sect('where', 'Ablage', 'Wo Zugangsdaten, Konfiguration und Log liegen.', `
    <div class="small">Zugangsdaten: ${esc(S.storage.text)}</div>
    ${S.storage.keyring ? '' : '<div class="hint">Kein Schlüsselbund gefunden. Besser: <code>pip install keyring</code> in der Python-Umgebung von tinyops (siehe README). Bis dahin liegen Tokens in einer Datei, die nur dein Benutzer lesen kann.</div>'}
    <div class="small quiet" style="margin-top:8px">Config: ${esc(S.server.config)} (enthält nie Zugangsdaten)</div>
    <div class="small quiet">Log: ${esc(S.server.log)} · Adresse: ${esc(S.server.bind)}:${esc(S.server.port)} (nur per Neustart änderbar)</div>`)}
   </div>
  </div>
  <div class="savebar"><button class="primary" id="st-save" ${S.demo ? 'disabled' : ''}>Speichern</button>
    <span class="quiet small" id="st-msg">Änderungen gelten sofort nach dem Speichern, ohne Neustart.</span></div>`;
  renderJiraSecret(); renderProjects();
  $('gl-test').onclick = testGitlab; $('ji-test').onclick = testJira; $('st-save').onclick = saveSettings;
  $('pj-search').onclick = searchProjects; $('pj-q').onkeydown = ev => { if (ev.key === 'Enter') searchProjects(); };
  $('id-suggest').onclick = suggestIdentity; $('ji-auth').onchange = renderJiraSecret;
  if ($('gl-del')) $('gl-del').onclick = () => delSecrets(['gitlab_token'], 'GitLab-Token');
  if ($('ji-del')) $('ji-del').onclick = () => delSecrets(['jira_token', 'jira_password'], 'Jira-Zugangsdaten');
  box.querySelectorAll('[data-goto]').forEach(btn => btn.onclick = () => {
    box.querySelectorAll('[data-goto]').forEach(x => x.classList.toggle('on', x === btn));
    $('s-' + btn.dataset.goto).scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  });
}

function renderJiraSecret() {
  const basic = $('ji-auth').value === 'basic';
  $('ji-userbox').hidden = !basic;
  const name = basic ? 'jira_password' : 'jira_token';
  const old = $('ji-secret') ? $('ji-secret').value : '';
  $('ji-secbox').innerHTML = field('ji-secret', basic ? 'Passwort' : 'Personal Access Token', old, {
    type: 'password', err: name, ph: S.secrets[name].set ? '•••••••• gespeichert' : '',
    help: secretHelp(name, basic ? 'Passwort' : 'Token') + (basic ? ' Achtung: Mehrere falsche Passwörter in Folge können das Konto in Jira sperren; tinyops pausiert deshalb nach einem Fehlversuch 30 Sekunden.'
      : ` Anlegen in Jira: Profil → Personal Access Tokens. Ein Jira-Token hat die Rechte deines Kontos.`) });
}

function clearErrors() { document.querySelectorAll('.ferr').forEach(e => e.textContent = ''); }
function showErrors(errs) {
  clearErrors();
  Object.entries(errs || {}).forEach(([k, m]) => document.querySelectorAll(`.ferr[data-err="${k}"]`).forEach(e => e.textContent = m));
}

async function busy(btn, label, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}

function glForm() { return { url: val('gl-url'), ca_bundle: val('gl-ca'), token: $('gl-token').value, projects: P.map(p => p.id) }; }
function jiForm() {
  return { url: val('ji-url'), auth: val('ji-auth'), username: val('ji-user'), secret: $('ji-secret').value, ca_bundle: val('gl-ca'),
    project_keys: split(val('ji-keys')), issue_types: split(val('ji-types')), jql: val('ji-jql'), story_limit: val('ji-limit'),
    only_active_sprints: $('ji-sprint').checked };
}

async function testGitlab() {
  const out = $('gl-result');
  await busy($('gl-test'), 'Teste …', async () => {
    try { const r = await api('POST', '/api/settings/test/gitlab', glForm()); out.innerHTML = stepsHtml(r); window.glUser = r.user; }
    catch (e) { out.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
  });
}

async function testJira() {
  const out = $('ji-result');
  await busy($('ji-test'), 'Teste …', async () => {
    try {
      const r = await api('POST', '/api/settings/test/jira', jiForm());
      let extra = '';
      if (r.projects && r.projects.length) extra += `<div style="margin-top:8px" class="quiet">Sichtbare Projekt-Keys (Klick = hinzufügen):</div><div>${r.projects.slice(0, 40).map(k => `<button class="pchip" data-addkey="${esc(k)}">${esc(k)}</button>`).join('')}</div>`;
      if (r.types && r.types.length) extra += `<div style="margin-top:4px" class="quiet">Vorgangstypen (Klick = hinzufügen):</div><div>${r.types.map(k => `<button class="pchip" data-addtype="${esc(k)}">${esc(k)}</button>`).join('')}</div>`;
      out.innerHTML = stepsHtml(r) + extra;
    } catch (e) { out.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
  });
}
$('viewSettings').addEventListener('click', ev => {
  const k = ev.target.closest('[data-addkey]'), t = ev.target.closest('[data-addtype]');
  if (k) $('ji-keys').value = uniq(split(val('ji-keys')).concat(k.dataset.addkey)).join(', ');
  if (t) $('ji-types').value = uniq(split(val('ji-types')).concat(t.dataset.addtype)).join(', ');
});

// Projekte
function renderProjects() {
  $('pj-list').innerHTML = P.length ? P.map((p, i) => `<span class="pchip"><span class="quiet">#${esc(p.id)}</span>
    <input type="text" data-pn="${i}" value="${esc(p.name)}" aria-label="Anzeigename"><button data-pdel="${i}" title="Entfernen">×</button></span>`).join('')
    : '<div class="empty">Noch kein Projekt.</div>';
}
$('viewSettings').addEventListener('input', ev => { const i = ev.target.dataset.pn; if (i !== undefined) P[+i].name = ev.target.value; });
$('viewSettings').addEventListener('click', ev => {
  const d = ev.target.closest('[data-pdel]');
  if (d) { P.splice(+d.dataset.pdel, 1); renderProjects(); }
  const a = ev.target.closest('[data-padd]');
  if (a && !P.some(p => p.id === +a.dataset.padd)) { P.push({ id: +a.dataset.padd, name: a.dataset.name }); renderProjects(); a.disabled = true; a.textContent = 'hinzugefügt'; }
});
async function searchProjects() {
  const q = val('pj-q'), out = $('pj-res');
  await busy($('pj-search'), 'Suche …', async () => {
    try {
      const r = await api('POST', '/api/settings/projects', { url: val('gl-url'), ca_bundle: val('gl-ca'), token: $('gl-token').value, q });
      if (r.error) { out.innerHTML = `<div class="banner bad">${esc(r.error)}<br><span class="quiet">Erst oben die GitLab-Verbindung testen.</span></div>`; return; }
      out.innerHTML = r.items.length ? `<table class="mini">${r.items.map(p => `<tr><td>${esc(p.full || p.name)}</td><td>#${esc(p.id)}</td>
        <td><button data-padd="${esc(p.id)}" data-name="${esc(p.name)}">Hinzufügen</button></td></tr>`).join('')}</table>`
        : '<div class="empty">Nichts gefunden (es werden nur Projekte gezeigt, in denen du Mitglied bist).</div>';
    } catch (e) { out.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
  });
}

// Identität aus Commits vorschlagen
async function suggestIdentity() {
  const out = $('id-result');
  if (!P.length) { out.innerHTML = '<div class="banner warn">Erst unter GitLab ein Projekt hinzufügen.</div>'; return; }
  await busy($('id-suggest'), 'Lese Commits …', async () => {
    try {
      const r = await api('POST', '/api/settings/identity', { url: val('gl-url'), ca_bundle: val('gl-ca'), token: $('gl-token').value, project_id: P[0].id });
      if (r.error) { out.innerHTML = `<div class="banner bad">${esc(r.error)}</div>`; return; }
      out.innerHTML = `<div class="quiet">Autoren der letzten ${r.commits} Commits in ${esc(P[0].name)}. Kreuze an, wer du bist und wer dein Agent ist.</div>
        <table class="mini"><tr><th>Name</th><th>E-Mail</th><th>Commits</th><th>ich</th><th>Agent</th></tr>
        ${r.authors.map((a, i) => `<tr><td>${esc(a.name)}</td><td>${esc(a.email)}</td><td>${a.count}</td>
          <td><input type="checkbox" data-me="${i}" ${a.is_me ? 'checked' : ''}></td><td><input type="checkbox" data-ag="${i}"></td></tr>`).join('')}</table>
        ${r.trailers.length ? `<div class="quiet" style="margin-top:6px">Agent-Zeilen in Commit-Nachrichten (nur der stabile Anfang wird übernommen):</div>
          ${r.trailers.map((t, i) => `<label class="row"><input type="checkbox" data-tr="${i}" ${/claude|bot/i.test(t.pattern) ? 'checked' : ''}> ${esc(t.pattern)} <span class="quiet">(${t.count}×)</span></label>`).join('')}` : ''}
        <div class="row" style="margin:8px 0"><button class="primary" id="id-apply">Übernehmen</button></div>`;
      $('id-apply').onclick = () => {
        const sel = (attr) => r.authors.filter((a, i) => out.querySelector(`[${attr}="${i}"]`).checked);
        const me = sel('data-me'), ag = sel('data-ag');
        $('bf-emails').value = uniq(split(val('bf-emails')).concat(me.map(a => a.email).filter(Boolean))).join(', ');
        $('bf-names').value = uniq(split(val('bf-names')).concat(me.map(a => a.name).filter(Boolean))).join(', ');
        $('bf-aemails').value = uniq(split(val('bf-aemails')).concat(ag.map(a => a.email).filter(Boolean))).join(', ');
        $('bf-anames').value = uniq(split(val('bf-anames')).concat(ag.map(a => a.name).filter(Boolean))).join(', ');
        const pats = r.trailers.filter((t, i) => out.querySelector(`[data-tr="${i}"]`).checked).map(t => t.pattern);
        $('bf-pat').value = uniq(split(val('bf-pat')).concat(pats)).join(', ');
        toast('Übernommen. Noch speichern.');
      };
    } catch (e) { out.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
  });
}

// Speichern
function collect() {
  const secrets = {};
  if ($('gl-token').value.trim()) secrets.gitlab_token = $('gl-token').value;
  if ($('ji-secret').value.trim()) secrets[val('ji-auth') === 'basic' ? 'jira_password' : 'jira_token'] = $('ji-secret').value;
  return {
    gitlab: { url: val('gl-url'), ca_bundle: val('gl-ca') },
    projects: P,
    branch_filter: { emails: split(val('bf-emails')), names: split(val('bf-names')), agent_emails: split(val('bf-aemails')), agent_names: split(val('bf-anames')),
      agent_message_patterns: split(val('bf-pat')), max_branches: val('bf-max'), max_age_days: val('bf-age'), ignore_branches: split(val('bf-ignore')) },
    jira: { url: val('ji-url'), auth: val('ji-auth'), username: val('ji-user'), project_keys: split(val('ji-keys')), story_limit: val('ji-limit'),
      wip_issue_types: split(val('ji-types')), jql_in_progress: val('ji-jql'), only_active_sprints: $('ji-sprint').checked },
    features: { ideas: $('ft-ideas').checked, testenv: $('ft-testenv').checked },
    secrets,
  };
}
async function saveSettings() {
  clearErrors();
  await busy($('st-save'), 'Speichere …', async () => {
    try {
      const r = await api('POST', '/api/settings/save', collect());
      const where = Object.entries(r.secrets || {}).map(([k, v]) => `${k}: ${v}`).join('; ');
      toast('Gespeichert' + (where ? ' (' + where + ')' : ''));
      await loadSettings(); await load();
      if (S.gitlab.url) testGitlab();
      if (S.jira.url) testJira();
    } catch (e) {
      showErrors(e.data && e.data.errors);
      toast(e.message);
      const first = document.querySelector('.ferr:not(:empty)'); if (first) first.scrollIntoView({ block: 'center' });
    }
  });
}
async function delSecrets(names, label) {
  if (!confirm(label + ' wirklich aus dem Speicher löschen?')) return;
  try { await api('POST', '/api/settings/save', { ...collect(), secrets: {}, delete_secrets: names }); toast('Gelöscht'); await loadSettings(); await load(); }
  catch (e) { showErrors(e.data && e.data.errors); toast(e.message); }
}

load();
setInterval(load, 60000);
setInterval(() => { if (state && state.jobs && state.jobs.some(j => j.status === 'läuft')) load(); }, 4000);
</script>
</body>
</html>
