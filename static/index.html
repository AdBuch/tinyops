<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbeitspanel</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #1d1d1b; --quiet: #6b6b66; --line: #e3e3de;
    --ok: #1f7a4d; --bad: #b3261e; --run: #2457b8; --warn: #9a6200; --accent: #2457b8;
    --okbg: #e4f3ea; --badbg: #fbe6e4; --runbg: #e3ebfa; --warnbg: #fbf0d9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1e1e1c; --ink: #ecece8; --quiet: #9a9a93; --line: #34342f;
      --ok: #6fd1a0; --bad: #f2877f; --run: #8fb2f5; --warn: #e9b659; --accent: #8fb2f5;
      --okbg: #1b2e24; --badbg: #38211f; --runbg: #1d2638; --warnbg: #33290f;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .pill { padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; }
  .pill.ok { background: var(--okbg); color: var(--ok); }
  .pill.bad { background: var(--badbg); color: var(--bad); }
  .pill.neutral { background: var(--line); color: var(--quiet); }
  .pill.warn { background: var(--warnbg); color: var(--warn); }
  a.pill { text-decoration: none; }
  .spacer { flex: 1; }
  .quiet { color: var(--quiet); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 16px; padding: 16px; max-width: 1300px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--quiet); margin: 18px 0 8px; }
  h2:first-child { margin-top: 0; }
  .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
  .banner.bad { background: var(--badbg); color: var(--bad); }
  .banner.warn { background: var(--warnbg); color: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .card.stale { border-left: 4px solid var(--warn); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .title { font-weight: 600; }
  .meta { color: var(--quiet); font-size: 13px; }
  .badge { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--line); color: var(--quiet); }
  .badge.success { background: var(--okbg); color: var(--ok); }
  .badge.failed { background: var(--badbg); color: var(--bad); }
  .badge.running, .badge.pending { background: var(--runbg); color: var(--run); }
  .badge.draft { background: var(--warnbg); color: var(--warn); }
  .badge.ticket { background: var(--runbg); color: var(--run); }
  .badge.noticket { background: var(--warnbg); color: var(--warn); }
  a.btn { font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  a.btn:hover { border-color: var(--accent); text-decoration: none; }
  button, select { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  textarea { width: 100%; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); resize: vertical; }
  .idea { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .idea.expired { opacity: .5; }
  .idea:last-child { border-bottom: 0; }
  .empty { color: var(--quiet); font-style: italic; padding: 6px 0; }
  pre.log { background: #111; color: #d8d8d2; padding: 8px; border-radius: 8px; max-height: 240px; overflow: auto; font-size: 12px; white-space: pre-wrap; margin: 6px 0 0; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); width: min(720px, 92vw); }
  dialog textarea { height: 300px; font-family: ui-monospace, monospace; font-size: 13px; }
  .tabs { display: flex; gap: 4px; }
  .tab { border-radius: 8px; border: 1px solid transparent; background: transparent; font-weight: 600; }
  .tab.on { background: var(--card); border-color: var(--line); }
  main.single { grid-template-columns: minmax(0, 1fr); }
  #viewSettings { max-width: 860px; margin: 0 auto; padding: 16px 16px 96px; }
  #viewSettings h2 { margin-top: 0; }
  .field { display: grid; gap: 3px; margin-bottom: 10px; }
  .field > label { font-size: 13px; font-weight: 600; }
  .field .help { font-size: 12.5px; color: var(--quiet); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  input[type=text], input[type=password], input[type=number], select.full, textarea.full {
    width: 100%; font: inherit; font-size: 14px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea.full { font-family: ui-monospace, monospace; font-size: 13px; resize: vertical; }
  .ferr { color: var(--bad); font-size: 12.5px; min-height: 0; }
  .ferr:empty { display: none; }
  .steps { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .step { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .step .ic { font-weight: 800; text-align: center; }
  .step.ok .ic { color: var(--ok); } .step.fail .ic { color: var(--bad); } .step.warn .ic { color: var(--warn); } .step.skip { opacity: .6; }
  .step .st { font-weight: 600; }
  .step .sd { font-size: 13px; color: var(--quiet); white-space: pre-wrap; word-break: break-word; }
  .step.fail { background: var(--badbg); }
  .hint { margin-top: 4px; font-size: 13px; padding: 6px 9px; border-radius: 8px; background: var(--runbg); color: var(--ink); }
  .step.fail .hint { background: var(--card); }
  .verdict { padding: 8px 10px; font-weight: 650; }
  .verdict.ok { background: var(--okbg); color: var(--ok); } .verdict.bad { background: var(--badbg); color: var(--bad); }
  .chip { display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border-radius: 999px; background: var(--line); font-size: 13px; margin: 0 6px 6px 0; }
  .chip button { border: 0; background: transparent; padding: 0 2px; font-size: 15px; line-height: 1; }
  .chip input { width: 150px; padding: 2px 6px; font-size: 13px; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 12px; justify-content: center; align-items: center; z-index: 6; }
  table.mini { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.mini td, table.mini th { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; z-index: 10; }
</style>
</head>
<body>
<header>
  <h1>Arbeitspanel</h1>
  <nav class="tabs"><button class="tab on" data-view="overview">Übersicht</button><button class="tab" data-view="settings">Einstellungen</button></nav>
  <a id="pGl" class="pill neutral" href="#settings" style="display:none"></a>
  <a id="pJi" class="pill neutral" href="#settings" style="display:none"></a>
  <span id="stories" class="pill neutral" style="display:none"></span>
  <span id="wip" class="pill ok">WIP –</span>
  <a id="helpdesk" class="pill neutral" style="display:none" target="_blank" rel="noopener"></a>
  <span id="demo" class="pill" style="display:none;background:var(--warnbg);color:var(--warn)">Demo-Daten</span>
  <span class="spacer"></span>
  <span id="fetched" class="quiet"></span>
  <button id="logBtn">Log</button>
  <button id="refresh">Neu laden</button>
</header>
<main id="viewOverview">
  <section id="left"></section>
  <aside id="aside">
   <div id="ideasBox" hidden>
    <h2>Ideenbox <span id="ideaCount" class="quiet"></span></h2>
    <div class="card">
      <textarea id="ideaText" rows="2" placeholder="Idee kurz festhalten, Enter speichert (Shift+Enter = neue Zeile)"></textarea>
      <div class="row" style="margin-top:6px">
        <button id="triage">Triage-Prompt kopieren</button>
        <span class="quiet">Nur erfassen. Gestartet wird nichts.</span>
      </div>
      <div id="ideas"></div>
    </div>
   </div>
   <div id="jobsBox" hidden>
    <h2>Test-Jobs</h2>
    <div id="jobs"></div>
   </div>
  </aside>
</main>
<div id="viewSettings" hidden></div>

<dialog id="dlg">
  <div class="row" style="justify-content:space-between"><strong id="dlgTitle">Prompt</strong><button id="dlgClose">Schließen</button></div>
  <textarea id="dlgText" readonly></textarea>
  <div class="row" style="margin-top:8px"><button class="primary" id="dlgCopy">Kopieren</button></div>
</dialog>

<dialog id="logDlg" style="width:min(1000px,96vw)">
  <div class="row" style="justify-content:space-between">
    <strong>Log <span id="logFile" class="quiet" style="font-weight:400"></span></strong>
    <span class="row">
      <select id="logLevel"><option value="debug">alles</option><option value="info" selected>ab Info</option><option value="warning">nur Warnungen/Fehler</option></select>
      <button id="logReload">Neu laden</button><button id="logClose">Schließen</button>
    </span>
  </div>
  <pre class="log" id="logText" style="max-height:60vh"></pre>
  <div class="quiet" style="margin-top:6px">Alles Genauere (jede Anfrage, jede Branch-Entscheidung) steht nur im Log, wenn der Server mit <code>-v</code> oder <code>log_level: debug</code> läuft.</div>
</dialog>

<script>
const H = { 'X-Requested-With': 'tinyops', 'Content-Type': 'application/json' };
let state = null;
const openLogs = new Set();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: H, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || ('HTTP ' + r.status)); e.data = data; throw e; }
  return data;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

async function copyText(text, title) {
  try { await navigator.clipboard.writeText(text); toast('Kopiert'); return; } catch (e) { /* Fallback unten */ }
  document.getElementById('dlgTitle').textContent = title || 'Prompt';
  document.getElementById('dlgText').value = text;
  document.getElementById('dlg').showModal();
}

const pipelineLabel = { success: 'Pipeline grün', failed: 'Pipeline rot', running: 'Pipeline läuft', pending: 'Pipeline wartet', none: 'keine Pipeline' };

function card(it) {
  const badges = [];
  if (it.kind === 'branch') {
    badges.push('<span class="badge">kein MR</span>');
    if (it.ahead) badges.push(`<span class="badge" title="Commits vor dem Default-Branch">${it.ahead} Commit${it.ahead === 1 ? '' : 's'}</span>`);
    if (it.by_agent) badges.push('<span class="badge draft" title="Commits vom Agenten (Konto oder Co-Authored-By)">Agent</span>');
    else if (it.by_me) badges.push('<span class="badge" title="Mindestens ein Commit von dir">von mir</span>');
  }
  if (it.draft) badges.push('<span class="badge draft">Draft</span>');
  if (it.kind !== 'branch') badges.push(`<span class="badge ${esc(it.pipeline)}">${esc(pipelineLabel[it.pipeline] || it.pipeline)}</span>`);
  if (it.ticket) badges.push(`<a class="badge ticket" href="${esc(it.ticket.url)}" target="_blank" rel="noopener" title="${esc(it.ticket.summary)}">${esc(it.ticket.key)} · ${esc(it.ticket.status)}</a>`);
  else if (it.ticket_unknown) badges.push(`<span class="badge noticket" title="Dieser Key wurde in Jira nicht gefunden">${esc(it.ticket_unknown)}?</span>`);
  else if (it.no_ticket) badges.push('<span class="badge noticket">ohne Ticket</span>');
  const age = it.age_days === 0 ? 'heute' : `${it.age_days} Tage ohne Änderung`;
  const mrLabel = it.iid ? ` !${it.iid}` : '';
  const parts = [];
  const F = (state && state.features) || {};
  if (F.testenv && it.iid && it.can_deploy) {
    const opts = state.prompts.map(p => `<option>${esc(p)}</option>`).join('');
    const lock = it.agent_locked ? ' disabled title="Story-Limit überschritten: Agenten nur für Tickets, die schon in Arbeit sind"' : '';
    parts.push(`<button class="primary" data-act="deploy">Testumgebung starten</button>
      <button data-act="teardown">Abbauen</button>
      <select class="ps">${opts}</select>
      <button data-act="copy">Prompt kopieren</button>
      ${state.agent_enabled ? `<button data-act="agent"${lock}>Agent starten</button>` : ''}`);
  }
  if (it.no_ticket) {
    parts.push(`<a class="btn" href="${esc(it.create_url)}" target="_blank" rel="noopener">Ticket anlegen</a>`
      + (F.ideas ? `<button data-act="idea" data-text="${esc('Branch ' + it.branch + ': ' + it.title)}">In Ideenbox parken</button>` : ''));
  }
  const actions = parts.length ? `<div class="row" style="margin-top:8px" data-p="${it.project_id}" data-i="${it.iid ?? ''}">${parts.join('')}</div>` : '';
  return `<div class="card ${it.stale ? 'stale' : ''}">
    <div class="row"><span class="title">${esc(it.title)}</span>${badges.join('')}</div>
    <div class="meta">${esc(it.project)}${mrLabel} · <code>${esc(it.branch)}</code> · ${esc(age)}
      · <a href="${esc(it.url)}" target="_blank" rel="noopener">öffnen</a>${it.pipeline_url ? ` · <a href="${esc(it.pipeline_url)}" target="_blank" rel="noopener">Pipeline</a>` : ''}</div>
    ${actions}
  </div>`;
}

function section(title, items, emptyText) {
  return `<h2>${esc(title)} (${items.length})</h2>` + (items.length ? items.map(card).join('') : `<div class="empty">${esc(emptyText)}</div>`);
}

function storiesSection() {
  const j = state.jira;
  if (!j || !j.ok) return '';
  const rows = j.stories.map(s => {
    const linked = s.items.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${x.iid ? '!' + esc(x.iid) : esc(x.branch)}</a>`).join(', ');
    const flag = s.no_mr ? '<span class="badge noticket">kein MR</span>' : '';
    return `<div class="card story">
      <div class="row"><a class="title" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.key)} ${esc(s.summary)}</a>
        <span class="badge ticket">${esc(s.status)}</span>${flag}</div>
      <div class="meta">${linked ? 'MR/Branch: ' + linked : 'Noch kein MR oder Branch mit diesem Key.'}</div>
    </div>`;
  }).join('');
  return `<h2>Stories in Arbeit (${j.count}/${j.limit})</h2>` + (rows || '<div class="empty">Keine Story in Arbeit.</div>');
}

function renderLeft() {
  const mine = state.mine, review = state.review;
  const j = state.jira;
  const bereit = mine.filter(i => i.state === 'bereit' || i.state === 'offen');
  const waiting = review.concat(bereit);
  let html = '';
  if (!state.configured) {
    html += `<div class="banner warn"><strong>Noch nicht verbunden.</strong> ${state.problems.map(esc).join(' ')}
      <div style="margin-top:8px"><button class="primary" onclick="setView('settings')">Einstellungen öffnen</button></div></div>`;
  }
  if (state.errors.length) html += `<div class="banner bad">${state.errors.map(esc).join('<br>')}</div>`;
  if (j && j.ok && j.over) html += `<div class="banner bad"><strong>${j.count} Stories in Arbeit, Limit ${j.limit}.</strong> Schließe eine ab oder setze sie zurück, bevor etwas Neues beginnt. Agenten starten nur noch für Stories, die schon laufen.</div>`;
  else if (!(j && j.ok) && state.wip > state.wip_limit) html += `<div class="banner bad"><strong>${state.wip} offene Arbeiten, Limit ${state.wip_limit}.</strong> Erst abschließen oder parken, bevor etwas Neues startet.</div>`;
  const stale = mine.filter(i => i.stale).length;
  if (stale) html += `<div class="banner warn">${stale} Eintrag/Einträge seit ${state.stale_days} Tagen oder länger unberührt (gelb markiert). Mergen, parken oder löschen.</div>`;
  html += storiesSection();
  html += section('Wartet auf mich', waiting, 'Nichts wartet auf dich.');
  html += section('Mir zugeteilt', state.assigned, 'Dir ist nichts zugeteilt, was nicht von dir ist.');
  html += section('Läuft', mine.filter(i => i.state === 'laeuft'), 'Keine laufenden Pipelines.');
  html += section('Rot', mine.filter(i => i.state === 'rot'), 'Nichts Rotes.');
  html += section('Draft', mine.filter(i => i.state === 'draft'), 'Keine Drafts.');
  html += section('Offene Branches mit meinen oder Agent-Commits (ohne MR)', mine.filter(i => i.state === 'kein-mr'), 'Keine offenen Branches von dir oder deinem Agenten.');
  if (!state.configured) html = html.split('<h2>')[0];   // ohne Verbindung nur den Hinweis zeigen
  document.getElementById('left').innerHTML = html;
}

function renderIdeas() {
  const ideas = state.ideas;
  const open = ideas.filter(i => ['neu', 'geparkt'].includes(i.status) && !i.expired).length;
  document.getElementById('ideaCount').textContent = `${open}/${state.idea_cap}`;
  const list = ideas.filter(i => !['verworfen', 'erledigt'].includes(i.status));
  document.getElementById('ideas').innerHTML = list.length ? list.map(i => `
    <div class="idea ${i.expired ? 'expired' : ''}" data-id="${i.id}">
      <div>${esc(i.text)}</div>
      <div class="meta">${i.expired ? 'verfallen · ' : ''}${esc(i.status)} · ${i.age_days} Tage</div>
      <div class="row" style="margin-top:4px">
        ${i.status === 'neu' && !i.expired ? '<button data-ia="park">Parken</button>' : ''}
        <button data-ia="done">Erledigt</button>
        <button data-ia="drop">Verwerfen</button>
      </div>
    </div>`).join('') : '<div class="empty">Leer. Das ist ein gutes Zeichen.</div>';
}

function renderJobs() {
  const jobs = state.jobs;
  document.getElementById('jobs').innerHTML = jobs.length ? jobs.map(j => `
    <div class="card" data-job="${j.id}">
      <div class="row"><span class="badge ${j.status === 'ok' ? 'success' : j.status === 'fehler' ? 'failed' : 'running'}">${esc(j.status)}</span>
        <span>${esc(j.title)}</span></div>
      <div class="row" style="margin-top:6px"><button data-ja="log">${openLogs.has(j.id) ? 'Log zu' : 'Log'}</button></div>
      <pre class="log" id="log${j.id}" style="display:${openLogs.has(j.id) ? 'block' : 'none'}"></pre>
    </div>`).join('') : '<div class="empty">Noch nichts gestartet.</div>';
  openLogs.forEach(loadLog);
}

async function loadLog(id) {
  try {
    const j = await api('GET', '/api/jobs/' + id);
    const el = document.getElementById('log' + id);
    if (el) { el.textContent = j.log.join('\n'); el.scrollTop = el.scrollHeight; }
  } catch (e) { /* Job weg */ }
}

function renderHeader() {
  const j = state.jira;
  const s = document.getElementById('stories');
  const w = document.getElementById('wip');
  if (j && j.ok) {
    s.style.display = '';
    s.textContent = `Stories ${j.count}/${j.limit}`;
    s.className = 'pill ' + (j.over ? 'bad' : 'ok');
    w.textContent = `${state.wip} MR/Branches`;
    w.className = 'pill neutral';
  } else {
    s.style.display = 'none';
    w.textContent = `WIP ${state.wip}/${state.wip_limit}`;
    w.className = 'pill ' + (state.wip > state.wip_limit ? 'bad' : 'ok');
  }
  if (!state.configured) w.style.display = 'none'; else w.style.display = '';
  const h = state.helpdesk, hd = document.getElementById('helpdesk');
  if (!h) { hd.style.display = 'none'; }
  else {
    hd.style.display = '';
    if (h.error) {
      hd.textContent = 'Helpdesk ?'; hd.title = h.error; hd.removeAttribute('href'); hd.className = 'pill neutral';
    } else {
      hd.textContent = `Helpdesk ${h.open}${h.truncated ? '+' : ''} · ältestes ${h.oldest_hours} h` + (h.over_hours ? ` · ${h.over_hours} über ${h.sla_hours} h` : '');
      hd.title = 'Öffnet die Liste in Jira. Zahl wird nur alle paar Minuten aktualisiert.';
      hd.href = h.url; hd.className = 'pill ' + (h.over_hours ? 'warn' : 'neutral');
    }
  }
  const gl = document.getElementById('pGl'), ji = document.getElementById('pJi');
  gl.style.display = ''; ji.style.display = '';
  if (!state.configured) { gl.textContent = 'GitLab: nicht verbunden'; gl.className = 'pill bad'; }
  else if (state.errors.some(e => !e.startsWith('Jira'))) { gl.textContent = 'GitLab: Fehler'; gl.className = 'pill bad'; gl.title = 'Details im Banner oder unter Einstellungen'; }
  else { gl.textContent = 'GitLab ✓'; gl.className = 'pill ok'; }
  if (state.jira && state.jira.ok) { ji.textContent = 'Jira ✓'; ji.className = 'pill ok'; }
  else if (state.jira) { ji.textContent = 'Jira: Fehler'; ji.className = 'pill bad'; ji.title = state.jira.error; }
  else { ji.textContent = 'Jira: aus'; ji.className = 'pill neutral'; }
  document.getElementById('demo').style.display = state.demo ? '' : 'none';
  document.getElementById('fetched').textContent = 'Stand ' + new Date(state.fetched * 1000).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
}

function renderAside() {
  const F = state.features || {};
  document.getElementById('ideasBox').hidden = !F.ideas;
  document.getElementById('jobsBox').hidden = !F.testenv;
  document.getElementById('aside').hidden = !(F.ideas || F.testenv);
  document.getElementById('viewOverview').classList.toggle('single', !(F.ideas || F.testenv));
}

let firstLoad = true;
async function load() {
  try {
    state = await api('GET', '/api/overview');
    renderHeader(); renderLeft(); renderAside();
    if (state.features.ideas) renderIdeas();
    if (state.features.testenv) renderJobs();
    if (firstLoad) { firstLoad = false; if (!state.configured && !state.demo) setView('settings'); }
  } catch (e) { toast(e.message); }
}

// Aktionen auf Karten
document.getElementById('left').addEventListener('click', async ev => {
  const btn = ev.target.closest('button[data-act]');
  if (!btn) return;
  if (btn.dataset.act === 'idea') {
    try { await api('POST', '/api/ideas', { text: btn.dataset.text }); toast('In der Ideenbox'); await load(); } catch (e) { toast(e.message); }
    return;
  }
  const row = btn.closest('[data-p]');
  const body = { project_id: +row.dataset.p, iid: +row.dataset.i };
  const name = row.querySelector('.ps')?.value;
  try {
    if (btn.dataset.act === 'deploy') { await api('POST', '/api/deploy', body); toast('Deploy gestartet'); }
    if (btn.dataset.act === 'teardown') {
      if (!confirm('Test-Namespace dieses MR abbauen?')) return;
      await api('POST', '/api/teardown', body); toast('Abbau gestartet');
    }
    if (btn.dataset.act === 'copy') { const r = await api('POST', '/api/prompt', { ...body, name }); await copyText(r.prompt, 'Prompt: ' + name); return; }
    if (btn.dataset.act === 'agent') {
      if (!confirm(`Agent mit Prompt "${name}" lokal starten?`)) return;
      await api('POST', '/api/agent', { ...body, name }); toast('Agent gestartet');
    }
    await load();
  } catch (e) { toast(e.message); }
});

// Ideen
document.getElementById('ideaText').addEventListener('keydown', async ev => {

document.getElementById('ideas').addEventListener('click', async ev => {

});
document.getElementById('triage').addEventListener('click', async () => {

});

function setView(v) {
  view = v;
  document.getElementById('viewOverview').hidden = v !== 'overview';
  document.getElementById('viewSettings').hidden = v !== 'settings';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
  try { history.replaceState(null, '', '#' + v); } catch (e) { /* egal */ }
  if (v === 'settings') loadSettings();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => setView(t.dataset.view));

const $ = id => document.getElementById(id);
const val = id => ($(id) ? $(id).value : '').trim();
const split = t => t.split(/[,\n]/).map(x => x.trim()).filter(Boolean);
const uniq = a => [...new Set(a)];

function field(id, label, value, opts = {}) {
  const t = opts.type || 'text';
  const input = opts.area
    ? `<textarea class="full" id="${id}" rows="${opts.rows || 3}" spellcheck="false">${esc(value)}</textarea>`
    : `<input type="${t}" id="${id}" value="${esc(value)}" ${opts.ph ? `placeholder="${esc(opts.ph)}"` : ''} autocomplete="off" spellcheck="false">`;
  return `<div class="field"><label for="${id}">${esc(label)}</label>${input}
    ${opts.help ? `<div class="help">${opts.help}</div>` : ''}<div class="ferr" data-err="${esc(opts.err || '')}"></div></div>`;
}

function stepsHtml(res) {
  const ic = { ok: '✓', fail: '✗', warn: '!', skip: '–' };
  return '<div class="steps">' + res.steps.map(s => `
    <div class="step ${esc(s.status)}"><span class="ic">${ic[s.status] || '?'}</span><div>
      <div class="st">${esc(s.title)}</div>
      ${s.detail ? `<div class="sd">${esc(s.detail)}</div>` : ''}
      ${s.hint ? `<div class="hint">💡 ${esc(s.hint)}</div>` : ''}</div></div>`).join('')
    + `<div class="verdict ${res.ok ? 'ok' : 'bad'}">${res.ok ? 'Verbindung in Ordnung.' : 'Nicht in Ordnung: Der erste rote Schritt zeigt, wo es hängt.'}</div></div>`;
}

function secretHelp(name, label) {
  const st = S.secrets[name];
  if (st.error) return `<span style="color:var(--bad)">${esc(st.error)}</span>`;
  return st.set ? `Gespeichert (← ${esc(st.source)}). Feld leer lassen, um ihn zu behalten.` : `Noch kein ${label} gespeichert.`;
}

      : ` Anlegen in Jira: Profil → Personal Access Tokens. Ein Jira-Token hat die Rechte deines Kontos.`) });

function clearErrors() { document.querySelectorAll('.ferr').forEach(e => e.textContent = ''); }
function showErrors(errs) {
  clearErrors();
  Object.entries(errs || {}).forEach(([k, m]) => document.querySelectorAll(`.ferr[data-err="${k}"]`).forEach(e => e.textContent = m));
}

async function busy(btn, label, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}

function glForm() { return { url: val('gl-url'), ca_bundle: val('gl-ca'), token: $('gl-token').value, projects: P.map(p => p.id) }; }
function jiForm() {
  return { url: val('ji-url'), auth: val('ji-auth'), username: val('ji-user'), secret: $('ji-secret').value, ca_bundle: val('gl-ca'),
    project_keys: split(val('ji-keys')), issue_types: split(val('ji-types')), jql: val('ji-jql'), story_limit: val('ji-limit') };
}

async function testGitlab() {
  const out = $('gl-result');

    try { const r = await api('POST', '/api/settings/test/gitlab', glForm()); out.innerHTML = stepsHtml(r); window.glUser = r.user; }
    catch (e) { out.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
  });
}

async function testJira() {
  const out = $('ji-result');

    try {
      const r = await api('POST', '/api/settings/test/jira', jiForm());
      let extra = '';

// Projekte
function renderProjects() {
  $('pj-list').innerHTML = P.length ? P.map((p, i) => `<span class="chip"><span class="quiet">#${esc(p.id)}</span>
    <input type="text" data-pn="${i}" value="${esc(p.name)}" aria-label="Anzeigename"><button data-pdel="${i}" title="Entfernen">×</button></span>`).join('')
    : '<div class="empty">Noch kein Projekt.</div>';
}
$('viewSettings').addEventListener('input', ev => { const i = ev.target.dataset.pn; if (i !== undefined) P[+i].name = ev.target.value; });
$('viewSettings').addEventListener('click', ev => {
  const d = ev.target.closest('[data-pdel]');
  if (d) { P.splice(+d.dataset.pdel, 1); renderProjects(); }
  const a = ev.target.closest('[data-padd]');
  if (a && !P.some(p => p.id === +a.dataset.padd)) { P.push({ id: +a.dataset.padd, name: a.dataset.name }); renderProjects(); a.disabled = true; a.textContent = 'hinzugefügt'; }

async function searchProjects() {
  const q = val('pj-q'), out = $('pj-res');
  await busy($('pj-search'), 'Suche …', async () => {
    try {
      const r = await api('POST', '/api/settings/projects', { url: val('gl-url'), ca_bundle: val('gl-ca'), token: $('gl-token').value, q });
      if (r.error) { out.innerHTML = `<div class="banner bad">${esc(r.error)}<br><span class="quiet">Erst oben die GitLab-Verbindung testen.</span></div>`; return; }
      out.innerHTML = r.items.length ? `<table class="mini">${r.items.map(p => `<tr><td>${esc(p.full || p.name)}</td><td>#${esc(p.id)}</td>

        : '<div class="empty">Nichts gefunden (es werden nur Projekte gezeigt, in denen du Mitglied bist).</div>';
    } catch (e) { out.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
  });
}

      out.innerHTML = `<div class="quiet">Autoren der letzten ${r.commits} Commits in ${esc(P[0].name)}. Kreuze an, wer du bist und wer dein Agent ist.</div>
        <table class="mini"><tr><th>Name</th><th>E-Mail</th><th>Commits</th><th>ich</th><th>Agent</th></tr>
        ${r.authors.map((a, i) => `<tr><td>${esc(a.name)}</td><td>${esc(a.email)}</td><td>${a.count}</td>
          <td><input type="checkbox" data-me="${i}" ${a.is_me ? 'checked' : ''}></td><td><input type="checkbox" data-ag="${i}"></td></tr>`).join('')}</table>
        ${r.trailers.length ? `<div class="quiet" style="margin-top:6px">Agent-Zeilen in Commit-Nachrichten (nur der stabile Anfang wird übernommen):</div>
          ${r.trailers.map((t, i) => `<label class="row"><input type="checkbox" data-tr="${i}" ${/claude|bot/i.test(t.pattern) ? 'checked' : ''}> ${esc(t.pattern)} <span class="quiet">(${t.count}×)</span></label>`).join('')}` : ''}
        <div class="row" style="margin:8px 0"><button class="primary" id="id-apply">Übernehmen</button></div>`;
      $('id-apply').onclick = () => {
        const sel = (attr) => r.authors.filter((a, i) => out.querySelector(`[${attr}="${i}"]`).checked);
        const me = sel('data-me'), ag = sel('data-ag');
        $('bf-emails').value = uniq(split(val('bf-emails')).concat(me.map(a => a.email).filter(Boolean))).join(', ');
        $('bf-names').value = uniq(split(val('bf-names')).concat(me.map(a => a.name).filter(Boolean))).join(', ');
        $('bf-aemails').value = uniq(split(val('bf-aemails')).concat(ag.map(a => a.email).filter(Boolean))).join(', ');
        $('bf-anames').value = uniq(split(val('bf-anames')).concat(ag.map(a => a.name).filter(Boolean))).join(', ');
        const pats = r.trailers.filter((t, i) => out.querySelector(`[data-tr="${i}"]`).checked).map(t => t.pattern);
        $('bf-pat').value = uniq(split(val('bf-pat')).concat(pats)).join(', ');
        toast('Übernommen. Noch speichern.');
      };
    } catch (e) { out.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
  });
}

// Speichern
function collect() {
  const secrets = {};
  if ($('gl-token').value.trim()) secrets.gitlab_token = $('gl-token').value;
  if ($('ji-secret').value.trim()) secrets[val('ji-auth') === 'basic' ? 'jira_password' : 'jira_token'] = $('ji-secret').value;
  return {
    gitlab: { url: val('gl-url'), ca_bundle: val('gl-ca') },
    projects: P,
    branch_filter: { emails: split(val('bf-emails')), names: split(val('bf-names')), agent_emails: split(val('bf-aemails')), agent_names: split(val('bf-anames')),
      agent_message_patterns: split(val('bf-pat')), max_branches: val('bf-max'), max_age_days: val('bf-age') },
    jira: { url: val('ji-url'), auth: val('ji-auth'), username: val('ji-user'), project_keys: split(val('ji-keys')), story_limit: val('ji-limit'),
      wip_issue_types: split(val('ji-types')), jql_in_progress: val('ji-jql') },
    features: { ideas: $('ft-ideas').checked, testenv: $('ft-testenv').checked },
    secrets,
  };
}
async function saveSettings() {
  clearErrors();
  await busy($('st-save'), 'Speichere …', async () => {
    try {
      const r = await api('POST', '/api/settings/save', collect());
      const where = Object.entries(r.secrets || {}).map(([k, v]) => `${k}: ${v}`).join('; ');
      toast('Gespeichert' + (where ? ' (' + where + ')' : ''));
      await loadSettings(); await load();
      if (S.gitlab.url) testGitlab();
      if (S.jira.url) testJira();
    } catch (e) {
      showErrors(e.data && e.data.errors);
      toast(e.message);
      const first = document.querySelector('.ferr:not(:empty)'); if (first) first.scrollIntoView({ block: 'center' });
    }
  });
}
async function delSecrets(names, label) {
  if (!confirm(label + ' wirklich aus dem Speicher löschen?')) return;
  try { await api('POST', '/api/settings/save', { ...collect(), secrets: {}, delete_secrets: names }); toast('Gelöscht'); await loadSettings(); await load(); }
  catch (e) { showErrors(e.data && e.data.errors); toast(e.message); }
}

load();
setInterval(load, 60000);
setInterval(() => { if (state && state.jobs && state.jobs.some(j => j.status === 'läuft')) load(); }, 4000);
</script>
