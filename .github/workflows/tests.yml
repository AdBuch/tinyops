name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: tmux für die Agenten-Tests
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux
      - name: Tests
        working-directory: tests
        env:
          TINYOPS_NO_WATCHDOG: "1"
        run: python -m unittest discover -s . -p 'test_*.py'
      - name: Selbsttest
        env:
          TINYOPS_NO_WATCHDOG: "1"
        run: python server.py --selftest
