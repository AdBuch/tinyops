name: Auto-Tag

# Auf main: Steht in server.py eine VERSION, zu der es noch keinen Tag gibt, setzt dieser Ablauf den Tag vX.Y.Z
# auf genau diesen Commit und baut das Release (Launcher, Zipapp, Notizen aus dem CHANGELOG).
# Damit reicht «git push origin main»; Tags von Hand pushen ist nicht mehr nötig.
on:
  push:
    branches: [main]
    paths: ["server.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autotag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Version lesen
        run: |
          V=$(python3 -c "import re;print(re.search(r'^VERSION = \"([0-9]+\\.[0-9]+\\.[0-9]+)\"', open('server.py').read(), re.M).group(1))")
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "Tag v$V gibt es schon."
          elif ! grep -q "^## \[$V\]" CHANGELOG.md; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "::warning::CHANGELOG hat keinen Abschnitt [$V]; kein Tag."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag setzen
        if: steps.v.outputs.new == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "tinyops $TAG" "$GITHUB_SHA"
          git push origin "$TAG"

  release:
    needs: tag
    if: needs.tag.outputs.new == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
